<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>
      <img style="padding-top: 15px" width="100px" src="assets/citAbbyLogo.png" alt="Citizen Abacus logo"/>
    </mat-toolbar>
    <mat-nav-list>
      <a mat-list-item href="{{environment.siteLinks.tradResume}}">Traditional resume</a>
      <a mat-list-item href="{{environment.siteLinks.interactiveResume}}">Interactive resume</a>
    </mat-nav-list>
    Projects
    <mat-nav-list>
      <app-project-link [projectLink]="environment.siteLinks.techResume" [projectName]="'Tech Resume'" [projectSrcLink]="'https://github.com/pmeyerin/tech-resume'"></app-project-link>
      <app-project-link [projectName]="'Protocol SN'" [projectSrcLink]="'https://github.com/orgs/protocol-sn/repositories'"></app-project-link>
      <app-project-link [projectName]="'Factorio Quality Calc'"
                        [projectLink]="'https://factorio-quality-calculator.citizenabacus.com/'"
                        [projectSrcLink]="'https://github.com/pmeyerin/factorio-quality-calculator'"></app-project-link>
      <app-project-link [projectName]="'Ruby Mafia'"
                        [projectSrcLink]="'https://github.com/pmeyerin/ruby-mafia'"></app-project-link>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
        *ngIf="isHandset$ | async">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span>Citizen Abacus </span> <span *ngIf="!mobile">&nbsp;- a developer site for John Meyerin</span>
    </mat-toolbar>
    <iframe [src]="blogEmbedUrl" width="100%" height="100%" title="blog embed" style="border: 0px"></iframe>
  </mat-sidenav-content>
</mat-sidenav-container>
